function withId(list) { return list.map((p, i) => ({ ...p, id: `p${i}_${p.num}` })); }

// ===== 계산 로직 (원본 JSX와 동일) =====
function calc(p) {
  const TB = p.b1 * 1 + p.b2 * 2 + p.b3 * 3 + p.hr * 4;
  const AVG = p.ab ? p.h / p.ab : 0;
  const obpDen = p.ab + p.bb + p.hbp + p.sf;
  const OBP = obpDen ? (p.h + p.bb + p.hbp) / obpDen : 0;
  const SLG = p.ab ? TB / p.ab : 0;
  const OPS = OBP + SLG;
  const wobaDen = p.ab + p.bb + p.sf + p.hbp;
  const wOBA = wobaDen
    ? (0.69 * p.bb + 0.72 * p.hbp + 0.89 * p.b1 + 1.27 * p.b2 + 1.62 * p.b3 + 2.1 * p.hr) / wobaDen
    : 0;
  return { AVG, OBP, SLG, OPS, wOBA };
}
function teamOf(list) {
  const t = {};
  FIELDS.forEach((f) => (t[f] = list.reduce((s, p) => s + (Number(p[f]) || 0), 0)));
  return { ...t, ...calc(t) };
}
function fmt3(x) { return isFinite(x) ? x.toFixed(3) : "—"; }

function opsColor(ops) {
  const stops = [
    { v: 0.35, c: [196, 90, 76] }, { v: 0.7, c: [230, 178, 92] },
    { v: 1.0, c: [124, 178, 96] }, { v: 1.35, c: [47, 125, 79] },
  ];
  const v = Math.max(stops[0].v, Math.min(stops[stops.length - 1].v, ops));
  let lo = stops[0], hi = stops[stops.length - 1];
  for (let i = 0; i < stops.length - 1; i++) {
    if (v >= stops[i].v && v <= stops[i + 1].v) { lo = stops[i]; hi = stops[i + 1]; break; }
  }
  const t = hi.v === lo.v ? 0 : (v - lo.v) / (hi.v - lo.v);
  const c = lo.c.map((a, i) => Math.round(a + (hi.c[i] - a) * t));
  return `rgba(${c[0]},${c[1]},${c[2]},0.9)`;
}

function sortRows(list, key, dir) {
  const arr = [...list];
  arr.sort((a, b) => {
    const av = a[key], bv = b[key];
    if (av === bv) return a.name.localeCompare(b.name);
    return dir === "desc" ? bv - av : av - bv;
  });
  return arr;
}

  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      if (Array.isArray(parsed) && parsed.length) return parsed;
    }
  } catch (e) {}
  return withId(INITIAL_PLAYERS);
}
function persist() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.players));
    state.saveState = "saved";
  } catch (e) {
    state.saveState = "idle";
  }
}

}

  state.players = state.players.filter((p) => p.id !== id);

    cur.dir = cur.dir === "desc" ? "asc" : "desc";
  } else {
    state.sort[section] = { key, dir: "desc" };
  }
  render();
}

// ===== 렌더링 =====
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function cellDisplay(col, obj) {
  return col.rate ? fmt3(obj[col.key]) : obj[col.key];
}

function editorHTML(p) {
  const fieldInputs = FIELDS.map((f) => {
    const key = `${p.id}:${f}`;
    const val = key in state.raw ? state.raw[key] : p[f];
    return `<label class="field"><span>${FIELD_LABEL[f]}</span>
      <input type="number" step="1" inputmode="numeric"
        data-pid="${p.id}" data-field="${f}" data-kind="num" value="${esc(val)}"></label>`;
  }).join("");
  const status = p.pa >= PA_THRESHOLD
    ? `<span class="good">· 규정타석 이상 (PA ${p.pa})</span>`
    : `<span>· 규정타석 미만 (PA ${p.pa}, ${PA_THRESHOLD - p.pa}타석 더 필요)</span>`;
  return `
    <div class="ed-top">
      <div class="ed-left">
        <input class="ed-input" style="width:110px;font-weight:600" value="${esc(p.name)}" data-pid="${p.id}" data-field="name" data-kind="text">
        <span class="note">배번</span>
        <input class="ed-input mono" style="width:64px" type="number" value="${esc(p.num)}" data-pid="${p.id}" data-field="num" data-kind="num">
      </div>
      <div style="display:flex;gap:6px">
        <button class="btn btn-danger btn-sm" data-del="${p.id}">선수 삭제</button>
        <button class="btn btn-sm" data-close="1">닫기</button>
      </div>
    </div>
    <div class="fields">${fieldInputs}</div>
    <div class="ed-foot">OPS ${fmt3(p.OPS)} · wOBA ${fmt3(p.wOBA)} ${status}</div>`;
}

function sectionHTML({ list, sortKey, sortDir, teamRow, sectionId, badgeText, badgeBg, badgeFg, note }) {
  const colsCount = COLS.length + 3;
  const head = COLS.map((c) => {
    const active = sortKey === c.key;
    const arrow = active ? (sortDir === "desc" ? " ▼" : " ▲") : "";
    return `<th class="${active ? "active" : ""}" data-sort="${c.key}" data-sec="${sectionId}">${c.label}${arrow}</th>`;
  }).join("");

  const body = list.length === 0
    ? `<tr><td colspan="${colsCount}" class="empty">해당하는 선수가 없습니다.</td></tr>`
    : list.map((p, idx) => {
        const isEditing = state.editingId === p.id;
        const cells = COLS.map((c) => {
          const v = cellDisplay(c, p);
          const isOps = c.ops;
          const style = isOps ? `style="background:${opsColor(p.OPS)}"` : "";
          return `<td class="${isOps ? "ops" : ""}" ${style}>${v}</td>`;
        }).join("");
        const row = `<tr class="player ${isEditing ? "editing" : ""}" data-row="${p.id}">
            <td class="num-col">${idx + 1}</td>
            <td class="name">${esc(p.name)} <span class="note">#${esc(p.num)}</span></td>
            ${cells}
            <td class="act">${isEditing ? "닫기" : "수정"}</td>
          </tr>`;
        const editor = isEditing ? `<tr class="editor"><td colspan="${colsCount}">${editorHTML(p)}</td></tr>` : "";
        return row + editor;
      }).join("");

  const subCells = COLS.map((c) => `<td>${cellDisplay(c, teamRow)}</td>`).join("");

  return `
    <div class="section">
      <div class="section-head">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span class="badge" style="background:${badgeBg};color:${badgeFg}">${badgeText}</span>
          <span class="note">${note}</span>
        </div>
        <span class="scroll-hint">↔ 표를 옆으로 밀면 wOBA까지 더 보여요</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th class="left">#</th><th class="left">이름</th>${head}<th></th>
          </tr></thead>
          <tbody>
            ${body}
            <tr class="subtotal" style="background:${badgeBg}">
              <td></td><td class="name">소계 (${list.length}명)</td>${subCells}<td></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>`;
}

function render() {
  const active = document.activeElement;
  const focusInfo = active && active.dataset && active.dataset.field
    ? { pid: active.dataset.pid, field: active.dataset.field }
    : null;

  const rows = state.players.map((p) => ({ ...p, ...calc(p) }));
  const qualified = rows.filter((r) => r.pa >= PA_THRESHOLD);
  const unqualified = rows.filter((r) => r.pa < PA_THRESHOLD);
  const team = teamOf(state.players);
  const teamA = teamOf(qualified);
  const teamB = teamOf(unqualified);

  const sortedA = sortRows(qualified, state.sort.A.key, state.sort.A.dir);
  const sortedB = sortRows(unqualified, state.sort.B.key, state.sort.B.dir);

  const leaderAVG = [...qualified].sort((a, b) => b.AVG - a.AVG)[0];
  const leaderOPS = [...qualified].sort((a, b) => b.OPS - a.OPS)[0];
  const leaderHR = [...rows].sort((a, b) => b.hr - a.hr)[0];
  const leaderSB = [...rows].sort((a, b) => b.sb - a.sb)[0];

  const saveText = state.saveState === "saved" ? "✓ 이 기기에 저장됨" : "";

  document.getElementById("app").innerHTML = `
    <div class="hero">
      <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:6px">
        <div>
          <div class="hero-title">2027 FAKERS</div>
          <div class="hero-sub">타자 기록 · 세이버매트릭스</div>
        </div>
        <div class="save-state">${saveText}</div>
      </div>
      <div class="summary">
        ${[["팀 타율", fmt3(team.AVG)], ["팀 출루율", fmt3(team.OBP)], ["팀 장타율", fmt3(team.SLG)], ["팀 OPS", fmt3(team.OPS)]]
          .map(([l, v]) => `<div class="sum-card"><div class="sum-label">${l}</div><div class="sum-val">${v}</div></div>`).join("")}
      </div>
      <div class="hero-foot">총 ${state.players.length}명 등록 · 규정타석(${PA_THRESHOLD}타석) 이상 ${qualified.length}명 / 미만 ${unqualified.length}명 · 팀 합계 ${team.g}경기 ${team.ab}타수 ${team.h}안타</div>
    </div>

    <div class="leaders">
      <div class="leader"><div class="leader-title">타율 1위 (규정)</div><div class="leader-name">${leaderAVG ? esc(leaderAVG.name) : "—"}</div><div class="leader-val">${fmt3(leaderAVG ? leaderAVG.AVG : 0)}</div></div>
      <div class="leader"><div class="leader-title">OPS 1위 (규정)</div><div class="leader-name">${leaderOPS ? esc(leaderOPS.name) : "—"}</div><div class="leader-val">${fmt3(leaderOPS ? leaderOPS.OPS : 0)}</div></div>
      <div class="leader"><div class="leader-title">홈런 1위</div><div class="leader-name">${leaderHR && leaderHR.hr ? esc(leaderHR.name) : "—"}</div><div class="leader-val">${leaderHR && leaderHR.hr ? leaderHR.hr + "개" : "-"}</div></div>
      <div class="leader"><div class="leader-title">도루 1위</div><div class="leader-name">${leaderSB && leaderSB.sb ? esc(leaderSB.name) : "—"}</div><div class="leader-val">${leaderSB && leaderSB.sb ? leaderSB.sb + "개" : "-"}</div></div>
    </div>

    <div class="toolbar">
      <div class="toolbar-help">이름 행을 누르면 기록을 수정할 수 있어요. 숫자만 바꾸면 나머지 지표는 자동 계산됩니다.</div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-primary" id="btn-add">+ 선수 추가</button>
        <button class="btn" id="btn-reset">↺ 초기화</button>
      </div>
    </div>

    ${sectionHTML({ list: sortedA, sortKey: state.sort.A.key, sortDir: state.sort.A.dir, teamRow: teamA, sectionId: "A",
      badgeText: QUAL_LABEL, badgeBg: T.qualBg, badgeFg: "#1E6B3C", note: "타석 수를 채운 선수들의 순위표입니다." })}
    ${sectionHTML({ list: sortedB, sortKey: state.sort.B.key, sortDir: state.sort.B.dir, teamRow: teamB, sectionId: "B",
      badgeText: UNQUAL_LABEL, badgeBg: T.unqualBg, badgeFg: "#6B6A63", note: "표본이 적어 지표가 크게 흔들릴 수 있어요. 참고용으로 봐주세요." })}

    <div class="disclaimer">
      wOBA 가중치는 최근 MLB 표준 선형가중치를 준용한 근사값으로, 리그 득점 환경이 다른 사회인야구에서는
      절대값보다 팀 내 선수 간 상대 비교용으로 참고하세요. 타석이 ${PA_THRESHOLD}개를 넘어서면 선수가
      자동으로 "규정타석 이상" 표로 옮겨갑니다.
    </div>
    <div class="notice">
      ⚠ 기록은 이 휴대폰(브라우저)에만 저장됩니다. 다른 기기나 팀원과는 자동으로 공유되지 않아요.
    </div>
  `;

  if (focusInfo) {
    const el = document.querySelector(`[data-pid="${focusInfo.pid}"][data-field="${focusInfo.field}"]`);
    if (el) el.focus();
  }
}

// ===== 이벤트 위임 =====
document.addEventListener("click", (e) => {
  const t = e.target;
  const sortTh = t.closest("th[data-sort]");
  if (sortTh) return clickSort(sortTh.dataset.sec, sortTh.dataset.sort);

  const delBtn = t.closest("button[data-del]");
  if (delBtn) return removePlayer(delBtn.dataset.del);
  if (t.closest("button[data-close]")) { state.editingId = null; state.raw = {}; return render(); }

  if (t.closest("tr.editor")) return;

  const row = t.closest("tr.player");
  if (row) return toggleEdit(row.dataset.row);

  if (t.closest("#btn-add")) return addPlayer();
  if (t.closest("#btn-reset")) return resetAll();
});

document.addEventListener("input", (e) => {
  const el = e.target;
  if (!el.dataset || !el.dataset.field) return;
  const pid = el.dataset.pid, field = el.dataset.field;
  if (el.dataset.kind === "text") {
    updatePlayer(pid, field, el.value);
    return;
  }
  const key = `${pid}:${field}`;
  state.raw[key] = el.value;
  const num = el.value === "" ? 0 : Number(el.value);
  updatePlayer(pid, field, isFinite(num) ? num : 0);
  render();
});

document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.dataset && el.dataset.field && el.dataset.kind === "num") {
    delete state.raw[`${el.dataset.pid}:${el.dataset.field}`];
  }
});

// ===== 시작 =====
state.players = loadPlayers();
render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
